version: '3.8'

services:
  newapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newshow-api-proxy
    ports:
      - "3000:3000"
    environment:
      - SQL_DSN=sqlite:///data/one-api.db
      - LOG_LEVEL=info
      - FRONTEND_BUILD_DIR=/app/web/build
    volumes:
      - ./data:/data
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - api-network

networks:
  api-network:
    driver: bridge
